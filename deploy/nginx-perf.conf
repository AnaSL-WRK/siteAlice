# Performance snippet — include this inside your nginx server {} block.
#
# On the Pi, add this line to /etc/nginx/sites-available/your-site:
#   include /path/to/repo/deploy/nginx-perf.conf;
# Then: sudo nginx -t && sudo systemctl reload nginx

# ── Gzip for text assets (HTML, CSS, JS, JSON, SVG) ──────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

# ── Long-lived cache for /media (UUID filenames never repeat) ─────────────────
# FastAPI already sets Cache-Control on these; this adds an nginx-level expires
# header so nginx itself can serve from cache without hitting the backend.
location /media/ {
    proxy_pass http://127.0.0.1:8000;  # adjust port if needed
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# ── Moderate cache for static site assets (CSS/JS change on deploy) ───────────
location ~* \.(css|js)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}
