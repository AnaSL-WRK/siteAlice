        <link rel="stylesheet" href="src/styles/galery.css">

<body>
    <div class="header">
        <div class="container">
            <div class="logo" href="index.html">
                <a href="index.html"><h1 style="font-size: 70px;" >Alice nas Artes</h1></a> 
            </div> 
        </div>
        <div class="line"></div>
        <div class="navbar navbar-expand-lg"  role="navigation">
            <div class="navbar-nav">
                <ul>
                    <li><a href="pinturas.html">Pinturas</a></li>
            
                    <li>
                        <a href="fotografia.html">Fotografia<i class="fa-solid fa-chevron-down" style="padding-left: 10px;"></i></a>
                            <ul class="submenu">
                                <li><a href="#estruturas">Estruturas</a></li>

    <div class="container">
        <div class="heading"><h1>Fotografia</h1> </div>

        <div class="heading"><h2 id="estruturas">Estruturas</h2> </div>
        <div class="box" id="box-estruturas"
            data-endpoint="/api/fotos?category=estruturas"
            data-kind="fotografia"
            data-category="estruturas"
            data-overlay="none">
        </div>

        <div class="heading"><h2 id="praia">Praia</h2> </div>
        <div class="box" id="box-praia"
            data-endpoint="/api/fotos?category=praia"
            data-kind="fotografia"
            data-category="praia"
            data-overlay="none">
        </div>


        <div class="heading"><h2 id="natureza">Natureza</h2> </div>
        <div class="box" id="box-natureza"
            data-endpoint="/api/fotos?category=natureza"
            data-kind="fotografia"
            data-category="natureza"
            data-overlay="none">
        </div>

        <div class="heading"><h2 id="tema_livre">Tema Livre</h2> </div>
        <div class="box" id="box-tema-livre"
            data-endpoint="/api/fotos?category=tema_livre"
            data-kind="fotografia"
            data-category="tema_livre"
            data-overlay="none">
        </div>
    </div>

    <script type="module">
        import { renderBox } from "./src/gallery_modal.js";
        document.querySelectorAll(".box[data-endpoint]").forEach((b) => {
            renderBox({ boxId: b.id, endpoint: b.dataset.endpoint, overlayMode: b.dataset.overlay || "none" });
        });
    </script>



    <div class="line"></div>
    <div class="footer-basic">
        <footer style="text-align: center;">
            <p>Para informações sobre os quadros, contactar através do email ou do instagram.</p>
                
            <div class="social">
                <a href="mailto:alicenasartes@gmail.com"><i class="fa-regular fa-envelope"></i></a>
                <a href="https://www.instagram.com/alicedefatimaloureiro/"><i class="fa-brands fa-instagram"></i></a>
                
            </div>

    </div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<script type="module" src="./src/admin_overlay.js"></script>


<script>
    //smooth scrolling for anchors
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const target = document.querySelector(this.getAttribute('href'));
            target.scrollIntoView({
                behavior: 'smooth'
            });
        });
    });
</script>


</body>
</html>
