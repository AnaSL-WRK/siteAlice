<script>
    //smooth scrolling for anchors
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const target = document.querySelector(this.getAttribute('href'));
            target.scrollIntoView({
                behavior: 'smooth'
            });
        });
    });
</script>

<script>
    const modal = document.getElementById('universalModal');
    const modalImg = document.getElementById('modalImage');
    const modalDesc = document.getElementById('modalDesc');
    const closeBtn = modal.querySelector('.close');
    const modalContent = modal.querySelector('.modal-content');

    function openModal(imgSrc, descHtml = '') {
        modal.style.display = 'none';
        modalDesc.innerHTML = descHtml || '';

        modalImg.onload = () => {
            const w = modalImg.naturalWidth || 0;
            modalContent.style.height = (w > 500) ? '80%' : '100%';
            modal.style.display = 'flex';
        };

        modalImg.src = imgSrc;

        // fallback se já estiver carregada
        if (modalImg.complete) modalImg.onload();
        }

    function closeModal() {
        modal.style.display = 'none';
        modalImg.src = '';
        modalDesc.innerHTML = '';
    }

    document.addEventListener('click', (e) => {
        const container = e.target.closest('.image-container');
        if (!container) return;

        const img = container.querySelector('img');
        if (!img) return;

        const overlay = container.querySelector('.overlay');
        const desc = overlay ? overlay.innerHTML : '';

        openModal(img.src, desc);
    });


    // Fechar no X
    closeBtn.addEventListener('click', closeModal);

    // Fechar ao clicar fora do conteúdo (na sombra)
    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });

    // ESC para fechar
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });
</script>
