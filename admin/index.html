<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alice nas Artes - Admin</title>

  <link rel="stylesheet" href="/src/styles/galery.css">
  <link rel="stylesheet" href="/src/styles/admin_overlay.css">

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    window.__GOOGLE_CLIENT_ID__ = "592470068306-l60g26dm0ria5k2hdeitsn2dk83f6kdr.apps.googleusercontent.com";
    window.__API_BASE__ = "https://live.alicenasartes.net";
  </script>

  <style>
    body {
      background: #f7f7f7;
    }

    .admin-login-wrap {
      max-width: 520px;
      margin: 80px auto;
      background: rgba(255,255,255,0.92);
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      text-align: center;
    }

    .admin-login-wrap h1 {
      font-size: 28px;
      margin: 0 0 10px;
      color: navy;
    }

    .admin-login-wrap p {
      margin: 0 0 16px;
      opacity: .85;
      color: navy;
    }

    #gbtn {
      display: flex;
      justify-content: center;
      margin: 16px 0;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
      color: navy;
      min-height: 20px;
    }

    .small {
      font-size: 12px;
      opacity: .7;
      margin-top: 12px;
      color: navy;
    }

    .admin-actions {
      margin-top: 18px;
    }

    .admin-actions a {
      display: block;
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 0;
      text-decoration: none !important;
      font-weight: 700;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.06);
      color: navy !important;
    }
  </style>
</head>

<body>
  <div class="admin-login-wrap">
    <h1>Modo Admin</h1>
    <p>Escolhe a conta Google autorizada para entrar.</p>

    <div id="gbtn"></div>
    <div id="status" class="status"></div>

    <div class="admin-actions">
      <a href="/index.html">Voltar ao site</a>
    </div>
  </div>

  <script type="module">
    import { fetchJson } from "/src/api_client.js";

    const STORE = localStorage;
    const SS_TOKEN_KEY = "alicenasartes_admin_id_token";
    const SS_ON_KEY = "alicenasartes_admin_on";

    const GOOGLE_CLIENT_ID = window.__GOOGLE_CLIENT_ID__;
    const statusEl = document.getElementById("status");
    const gbtn = document.getElementById("gbtn");

    function setStatus(msg) {
      statusEl.textContent = msg || "";
    }

    function clearAdminSession() {
      STORE.removeItem(SS_TOKEN_KEY);
      STORE.removeItem(SS_ON_KEY);
    }

    function disableGoogleAutoSelect() {
      try {
        window.google?.accounts?.id?.disableAutoSelect();
      } catch {}
    }

    function waitForGsi(timeoutMs = 10000) {
      return new Promise((resolve, reject) => {
        const t0 = Date.now();

        const tick = () => {
          if (window.google?.accounts?.id) return resolve();

          if (Date.now() - t0 > timeoutMs) {
            return reject(new Error("Google login não carregou."));
          }

          setTimeout(tick, 60);
        };

        tick();
      });
    }

    function buildNextUrl() {
      const params = new URLSearchParams(location.search);
      const nextRaw = params.get("next") || "/index.html";

      const u = new URL(nextRaw, location.origin);
      u.searchParams.set("admin", "1");

      return u.pathname + u.search + u.hash;
    }

    function renderGoogleButton() {
      gbtn.innerHTML = "";

      window.google.accounts.id.renderButton(gbtn, {
        theme: "outline",
        size: "large",
        type: "standard",
        text: "signin_with",
        shape: "rectangular",
        use_fedcm_for_button: false,
      });
    }

    async function validateAndEnter(token) {
      setStatus("A validar permissões...");

      try {
        await fetchJson("/api/admin/me", {
          method: "GET",
          headers: { Authorization: `Bearer ${token}` },
        });

        STORE.setItem(SS_TOKEN_KEY, token);
        STORE.setItem(SS_ON_KEY, "1");

        setStatus("Autenticada ✅ A redirecionar...");
        location.href = buildNextUrl();
      } catch (e) {
        clearAdminSession();
        disableGoogleAutoSelect();
        setStatus("Sem permissões: " + e.message);
      }
    }

    async function init() {
      clearAdminSession();

      try {
        await waitForGsi();
      } catch (e) {
        setStatus("Erro: " + e.message);
        return;
      }

      disableGoogleAutoSelect();

      if (!GOOGLE_CLIENT_ID) {
        setStatus("Erro: __GOOGLE_CLIENT_ID__ não definido.");
        return;
      }

      window.google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        auto_select: false,
        cancel_on_tap_outside: false,
        callback: async (resp) => {
          const token = resp.credential;
          await validateAndEnter(token);
        },
      });

      renderGoogleButton();
    }

    init();
  </script>
</body>
</html>
